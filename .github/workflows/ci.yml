name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Golden cases
        run: python -m adaslog run-tests --results tmp/ci_results
      - name: Metrics
        run: python -m adaslog metrics --results tmp/ci_results --cases tests/cases
