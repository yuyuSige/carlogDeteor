name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + dev; UI optional — not required for CLI)
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Golden cases
        run: python -m adaslog run-tests --results tmp/ci_results
      - name: Metrics
        run: python -m adaslog metrics --results tmp/ci_results --cases tests/cases
      - name: Build wheel
        run: python -m build --wheel --outdir tmp/dist
      - name: Verify installed wheel (non-source cwd)
        run: |
          python -m venv tmp/wheel_venv
          tmp/wheel_venv/bin/pip install tmp/dist/adaslog-*.whl
          mkdir -p tmp/isolated_cwd
          cd tmp/isolated_cwd
          ../wheel_venv/bin/adaslog version
          ../wheel_venv/bin/python -c "from adaslog.core.config import load_json_resource, default_output_dir; load_json_resource('rules/signal_text.json'); print(default_output_dir())"
          ../wheel_venv/bin/adaslog analyze ../../tests/cases/positive/crash_case_01/input.log --format json --out reports --no-progress
          test -n "$(ls reports/*_analysis.json 2>/dev/null)"
          # Core wheel must not require Streamlit
          ../wheel_venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('streamlit') is None"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Golden cases
        run: python -m adaslog run-tests --results tmp/ci_results_win
      - name: CLI smoke
        run: |
          python -m adaslog version
          python -m adaslog analyze tests/cases/positive/crash_case_01/input.log --format json --out tmp/win_out --no-progress

  ui-optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with UI extra
        run: pip install -e ".[dev,ui]"
      - name: UI helper + AppTest smoke
        run: pytest tests/unit/test_ui_validation_and_session.py -q
      - name: Confirm Streamlit import
        run: python -c "import streamlit; import adaslog.ui.app"
