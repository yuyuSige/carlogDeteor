[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaslog"
version = "0.1.0"
description = "AI-Assisted ADAS Android Log Analysis and Root Cause Diagnosis (Evidence First)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
rich = ["rich>=13"]

[project.scripts]
adaslog = "adaslog.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
